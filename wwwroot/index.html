<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19b39b">
  <title>PokeVault</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-boxes" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-dex" viewBox="0 0 24 24"><path d="M5 19.5V5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5 2.5 2.5 0 0 0 7.5 23H19"/><path d="M9 7.5h6M9 11h4"/></symbol>
    <symbol id="i-meadow" viewBox="0 0 24 24"><path d="M10.5 20.5A7 7 0 0 1 3.5 13.5C3.5 7.5 8.5 3.5 20.5 3.5c0 11-4.5 16.5-10 17Z"/><path d="M3.5 21c4-6 7.5-9.5 11.5-12.5"/></symbol>
    <symbol id="i-games" viewBox="0 0 24 24"><path d="M6.5 7.5h11a4 4 0 0 1 3.9 4.9l-1 4.4a2.4 2.4 0 0 1-4.1 1.1L14.2 15.5H9.8l-2.1 2.4a2.4 2.4 0 0 1-4.1-1.1l-1-4.4A4 4 0 0 1 6.5 7.5Z"/><path d="M8 10.3v3.2M6.4 11.9h3.2"/><circle cx="15.8" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="17.9" cy="13.1" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-emu" viewBox="0 0 24 24"><rect x="5" y="2.8" width="14" height="18.4" rx="2.6"/><rect x="7.6" y="5.4" width="8.8" height="6.2" rx="1"/><path d="M8.6 15.6h2.8M10 14.2v2.8"/><circle cx="15" cy="15.2" r=".9" fill="currentColor" stroke="none"/><circle cx="16.4" cy="16.9" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.9l10.6-6.8a1 1 0 0 0 0-1.7L9.5 4.3A1 1 0 0 0 8 5.2Z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3.5 9.5h4l5-4.5v14l-5-4.5h-4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.8 6.3a8.4 8.4 0 0 1 0 11.4"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1-.1-2.2 1.2-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10Z"/><circle cx="7.5" cy="11" r="1.3"/><circle cx="10.5" cy="7" r="1.3"/><circle cx="15" cy="7.5" r="1.3"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2.5v12.5"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/></symbol>
    <symbol id="i-music-off" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2.5v12.5"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/><path d="M3 3l18 18"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3.5 9.5h4l5-4.5v14l-5-4.5h-4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M10.8 18.2h2.4"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8 12.3l2.8 2.8L16.2 9.2"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><rect x="3" y="3" width="5" height="5" rx="1.4"/><rect x="9.5" y="3" width="5" height="5" rx="1.4"/><rect x="16" y="3" width="5" height="5" rx="1.4"/><rect x="3" y="9.5" width="5" height="5" rx="1.4"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.4"/><rect x="16" y="9.5" width="5" height="5" rx="1.4"/><rect x="3" y="16" width="5" height="5" rx="1.4"/><rect x="9.5" y="16" width="5" height="5" rx="1.4"/><rect x="16" y="16" width="5" height="5" rx="1.4"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 20.5 20.5"/></symbol>
    <symbol id="i-vault" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 12h16M10 7.5h4M10 16.5h4"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 9.5h17M9.5 13h5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4.2L19.2 9a2.9 2.9 0 0 0-4.2-4.2L4 15.8z"/><path d="M13.6 6.3l4.1 4.1"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/><circle cx="12" cy="12" r="6.6"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2.8 20.2 7.4v9.2L12 21.2l-8.2-4.6V7.4z"/><path d="M3.8 7.4 12 12l8.2-4.6M12 12v9.2"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3 9.5 5.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></g></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7.5 13.5 12 9l4.5 4.5M5 4h14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></symbol>
    <symbol id="i-hide" viewBox="0 0 24 24"><path d="M3.5 3.5l17 17"/><path d="M10.2 6.2A9.6 9.6 0 0 1 12 6c5 0 8.5 4 9.5 6a12.4 12.4 0 0 1-2.8 3.6M6.9 7.5C4.7 8.9 3.2 10.8 2.5 12c1 2 4.5 6 9.5 6a9.3 9.3 0 0 0 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3.5h11l3.5 3.5v13.5H5z"/><path d="M8.5 3.5v4.5h6.5V3.5M8.5 20.5v-6h7v6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.2A2.2 2.2 0 0 1 5.7 5h3.8l2.2 2.5h6.6a2.2 2.2 0 0 1 2.2 2.2v7.1a2.2 2.2 0 0 1-2.2 2.2H5.7a2.2 2.2 0 0 1-2.2-2.2z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-sunset" viewBox="0 0 24 24"><path d="M3 17.5h18M7 17.5a5 5 0 0 1 10 0M4 21h16"/><path d="M12 3.5v5M9.6 6.2 12 8.6l2.4-2.4M4.6 11.6l1.4 1M19.4 11.6l-1.4 1"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6Z"/></symbol>
  </svg>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-name">PokeVault</span>
    </div>
    <nav class="mainnav" aria-label="Main">
      <button data-view="boxes" class="active"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-boxes"/></svg></span><span>Boxes</span></button>
      <button data-view="dex"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-dex"/></svg></span><span>Pokédex</span></button>
      <button data-view="meadow"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-meadow"/></svg></span><span>Meadow</span></button>
      <button data-view="games"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-games"/></svg></span><span>Games</span></button>
      <button data-view="play"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-emu"/></svg></span><span>Emulators</span></button>
    </nav>
    <div class="top-right">
      <span class="pill" id="statusPill">…</span>
      <span class="top-games" hidden>
        <label class="topbtn" title="Upload a save file"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><span>Upload a save</span><input type="file" id="uploadSave" hidden></label>
        <button class="topbtn" id="topPath" type="button" title="Add a save file from this PC"><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg><span>Add from this PC</span></button>
        <form class="path-pop" id="pathPop" hidden><input class="field" id="addPath" placeholder="Paste the save file's full path" autocomplete="off"><button class="btn" type="submit">Add</button></form>
      </span>
      <button class="iconbtn" id="themeBtn" type="button" title="Theme" aria-label="Theme"><svg class="i" aria-hidden="true"><use href="#i-palette"/></svg></button>
      <button class="iconbtn" id="musicBtn" type="button" title="Music on/off" aria-label="Music on/off"><svg class="i" aria-hidden="true"><use href="#i-music"/></svg></button>
      <button class="iconbtn" id="muteBtn" type="button" title="Sound on/off" aria-label="Sound on/off"><svg class="i" aria-hidden="true"><use href="#i-sound"/></svg></button>
      <button class="iconbtn" id="phoneBtn" type="button" title="Open on your phone" aria-label="Open on your phone"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg></button>
    </div>
  </header>

  <!-- ================= BOXES ================= -->
  <main class="view boxes-view" id="view-boxes">
    <div class="bx">
      <div class="bx-top">
        <div class="segment bx-sources" role="tablist" aria-label="Show"></div>
        <div class="bx-tools">
          <button class="bx-btn" id="btnAllBoxes" type="button" title="All boxes"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg><span>All Boxes</span></button>
          <button class="bx-btn" id="btnSearch" type="button" title="Search the vault"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span>Search</span></button>
          <button class="bx-btn" id="btnSelect" type="button" title="Select several"><svg class="i" aria-hidden="true"><use href="#i-select"/></svg><span>Select</span></button>
          <button class="bx-btn tool" id="btnBoxMenu" data-act="boxmenu" type="button" title="Box settings: name, wallpaper, add box, import" aria-label="Box settings"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg></button>
        </div>
      </div>

      <aside class="bx-search card" id="searchPanel" aria-label="Search the vault">
        <div class="bs-head"><b>Search</b><button class="bs-close" id="closeSearch" type="button" aria-label="Close" title="Close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
        <input type="search" id="search" placeholder="Name, nickname or OT" autocomplete="off">
        <div class="bs-filters">
          <select id="typeFilter" aria-label="Type"><option value="">Any type</option></select>
          <select id="genFilter" aria-label="Generation it came from"><option value="">Any generation</option></select>
          <label class="check"><input type="checkbox" id="shinyFilter"> ★ Shiny</label>
          <label class="check"><input type="checkbox" id="perfectFilter"> 6 perfect IVs</label>
        </div>
        <div class="smart-row" id="smartRow" aria-label="Smart boxes"></div>
        <button class="btn small ghost" id="smartSave" type="button" hidden>+ Save as smart box</button>
        <div id="results" class="results"></div>
      </aside>

      <div class="bx-left">
        <div class="boxes-layout">
          <aside class="party" id="party" hidden aria-label="Party">
            <div class="party-head">
              <span class="party-label">Party <small class="party-count"></small></span>
              <button class="party-toggle" type="button" aria-expanded="true" title="Hide the party"><svg class="i" aria-hidden="true"><use href="#i-prev"/></svg></button>
            </div>
            <div class="party-slots"></div>
          </aside>
          <section class="pane active" id="pane-game" data-side="game">
            <div class="pane-top"><div class="pane-tools"><button class="tool" data-act="select" type="button">Select</button></div></div>
            <div class="box" data-wall="g">
              <div class="box-head">
                <button class="arrow" data-step="-1" aria-label="Previous box" title="Previous box (Q)"><svg class="i" aria-hidden="true"><use href="#i-prev"/></svg></button>
                <button class="box-title" data-act="overview" type="button" title="All boxes"><span class="bt-ico"><svg class="i" aria-hidden="true"><use href="#i-box"/></svg></span><span class="name">—</span><small class="count"></small></button>
                <button class="arrow rename" data-act="rename" type="button" title="Rename this box" aria-label="Rename this box"><svg class="i" aria-hidden="true"><use href="#i-pencil"/></svg></button>
                <button class="arrow" data-step="1" aria-label="Next box" title="Next box (E)"><svg class="i" aria-hidden="true"><use href="#i-next"/></svg></button>
              </div>
              <div class="grid"></div>
            </div>
          </section>

          <section class="pane" id="pane-vault" data-side="vault">
            <div class="pane-top"><small id="vaultSub"></small><div class="pane-tools"><button class="tool" data-act="select" type="button">Select</button></div></div>
            <div class="box">
              <div class="box-head">
                <button class="arrow" data-step="-1" aria-label="Previous box" title="Previous box (Q)"><svg class="i" aria-hidden="true"><use href="#i-prev"/></svg></button>
                <button class="box-title" data-act="overview" type="button" title="All boxes"><span class="bt-ico"><svg class="i" aria-hidden="true"><use href="#i-box"/></svg></span><span class="name">Box 1</span><small class="count"></small></button>
                <button class="arrow rename" data-act="rename" type="button" title="Rename this box" aria-label="Rename this box"><svg class="i" aria-hidden="true"><use href="#i-pencil"/></svg></button>
                <button class="arrow" data-step="1" aria-label="Next box" title="Next box (E)"><svg class="i" aria-hidden="true"><use href="#i-next"/></svg></button>
              </div>
              <div class="grid"></div>
            </div>
          </section>
        </div>
      </div>

      <aside class="bx-detail empty" id="detail" aria-live="polite"></aside>
    </div>
  </main>

  <!-- ================= POKÉDEX ================= -->
  <main class="view" id="view-dex" hidden>
    <div class="dex-head card">
      <div class="dex-progress">
        <div class="ring" id="dexRing"><span id="dexPct">0%</span></div>
        <div>
          <h2>National Pokédex</h2>
          <p><b id="dexReg">0</b> of <span id="dexTotal">0</span> registered · <span id="dexShiny">0</span> ★ shiny · Living Dex <b id="dexLiving">0</b></p>
        </div>
        <button type="button" class="btn small ghost" id="trainerCardBtn" title="Make a shareable card of your collection">Trainer card</button>
      </div>
      <div class="dex-filters">
        <div class="chips" id="dexChips">
          <button class="chip active" data-f="all">All</button>
          <button class="chip" data-f="reg">Registered</button>
          <button class="chip" data-f="missing">Missing</button>
          <button class="chip" data-f="shiny">★ Shiny</button>
        </div>
        <input type="search" id="dexSearch" placeholder="Search" autocomplete="off">
        <select id="dexType" aria-label="Type"><option value="">Any type</option></select>
      </div>
    </div>
    <div class="dex-grid" id="dexGrid"></div>
  </main>

  <!-- ================= MEADOW (2D) ================= -->
  <main class="view meadow-view" id="view-meadow" hidden>
    <div class="meadow" id="meadow">
      <div class="meadow-hud">
        <label class="meadow-pick"><span>Who's out</span><select id="meadowSource"></select></label>
        <span class="meadow-status" id="meadowStatus"></span>
        <button type="button" class="meadow-photo" id="meadowPhoto" title="Photo mode: freeze the moment, add a frame and save it">📷 Photo</button>
      </div>
      <div class="meadow-card card" id="meadowCard" hidden></div>
      <div class="meadow-zoom"><button type="button" id="zoomIn" aria-label="Zoom in" title="Zoom in (+)">+</button><button type="button" id="zoomOut" aria-label="Zoom out" title="Zoom out (−)">−</button></div>
      <div class="joystick" id="joystick" aria-hidden="true"><div class="knob"></div></div>
    </div>
  </main>

  <!-- ================= GAMES ================= -->
  <main class="view games-view" id="view-games" hidden></main>
  <main class="view play-view" id="view-play" hidden></main>

  <!-- action bar for multi-select and slot picking -->
  <div class="actionbar" id="actionbar" hidden>
    <span class="ab-text" id="abText"></span>
    <div class="ab-buttons" id="abButtons"></div>
  </div>

  <!-- summary sheet -->
  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <button class="close sheet-close" id="closeSheet" type="button" aria-label="Close" title="Close (Esc)"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
    <div id="sheetBody"></div>
  </aside>

  <dialog id="dialog">
    <div id="dialogBody"></div>
    <div class="dialog-foot"><button class="btn ghost" id="dialogClose" type="button">Close</button></div>
  </dialog>

  <div class="summary" id="summary" hidden role="dialog" aria-modal="true" aria-label="Check Summary"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="playing" id="playing" hidden role="dialog" aria-modal="true" aria-labelledby="playingTitle">
    <div class="playing-card">
      <div class="playing-art"></div>
      <h2 id="playingTitle">Playing</h2>
      <p class="playing-sub"></p>
      <p class="playing-note">PokeVault is paused while you play. Save in the game and close the emulator: your boxes, party and Vault refresh by themselves.</p>
      <button class="btn ghost small" id="playingPeek" type="button">Look around while I play</button>
    </div>
  </div>
  <div class="catch-stack" id="catchStack" aria-live="polite"></div>
  <script src="sounds.js"></script>
  <script src="app.js"></script>
  <script src="cards.js"></script>
  <script src="gamepad.js"></script>
</body>
</html>
